<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Sage Ugras</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header>
    <a href="{{ '/' | relative_url }}" class="site-title">Sage Ugras</a>
    <nav>
      <ul>
        <li><a href="{{ '/projects/' | relative_url }}" class="btn-nav">PROJECTS</a></li>
        <li><a href="{{ '/about' | relative_url }}">ABOUT</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const slideshows = document.querySelectorAll(".project-slideshow");
    
    slideshows.forEach(slideshow => {
      const slides = slideshow.querySelectorAll(".slide");
      let currentIndex = 0;
      
      if (slides.length <= 1) return; // Skip if there's only 1 image
      
      // Ensure the first slide is active initially
      slides[0].classList.add("active");
      
      // Change slide every 3500 milliseconds (3.5 seconds)
      setInterval(() => {
        slides[currentIndex].classList.remove("active");
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add("active");
      }, 3500);
    });
  });
</script>
  
</body>
</html>
